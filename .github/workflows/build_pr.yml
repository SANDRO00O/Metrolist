name: Temporary Contribution Validation

on:
  pull_request:
    branches:
      - "**"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: true

      - name: Grant execute permission for Gradle wrapper
        run: chmod +x ./gradlew

      - name: Run unit tests
        run: ./gradlew --console=plain :app:testGmsDebugUnitTest --warning-mode summary

      - name: Assemble GMS Debug APK
        run: ./gradlew --console=plain assembleGmsDebug --warning-mode summary
        env:
          GITHUB_EVENT_NAME: pull_request
          METROLIST_APPLICATION_ID: com.metrolist.music.validation
          METROLIST_APP_NAME: Metrolist Validation
          PULL_REQUEST: "true"
          LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
          LASTFM_SECRET: ${{ secrets.LASTFM_SECRET }}
